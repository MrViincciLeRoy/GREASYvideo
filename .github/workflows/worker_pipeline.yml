name: Worker Pipeline

on:
  workflow_dispatch:
    inputs:
      chunk_id:
        description: 'Chunk ID from orchestrator DB'
        required: true
      job_id:
        description: 'Job ID from orchestrator DB'
        required: true
      series_url:
        description: 'AsuraComics series URL'
        required: true
      start_chapter:
        description: 'First chapter in this chunk'
        required: true
      end_chapter:
        description: 'Last chapter in this chunk'
        required: true

jobs:
  process-chunk:
    runs-on: ubuntu-latest
    timeout-minutes: 480

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: pip

    - name: Install system deps
      run: |
        sudo apt-get update
        sudo apt-get install -y tesseract-ocr espeak-ng ffmpeg libsm6 libxext6 libxrender-dev libgomp1

    - name: Install Python deps
      run: |
        pip install moviepy==1.0.3 imageio==2.31.1 imageio-ffmpeg
        pip install playwright
        playwright install chromium
        pip install -r requirements.txt

    - name: Mark chunk running
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      run: |
        python - <<'EOF'
        import os, requests
        url = os.environ['SUPABASE_URL']
        key = os.environ['SUPABASE_KEY']
        h = {'apikey': key, 'Authorization': f'Bearer {key}', 'Content-Type': 'application/json'}
        r = requests.patch(f"{url}/rest/v1/chunks",
            headers=h, json={'status': 'running'},
            params={'id': f"eq.${{ github.event.inputs.chunk_id }}"})
        print(f"Mark running: {r.status_code}")
        EOF

    - name: Scrape chapters from AsuraComics
      env:
        PYTHONPATH: ${{ github.workspace }}
      run: |
        python - <<'EOF'
        import asyncio, sys
        sys.path.insert(0, '.')
        from greasy.scraper import scrape_chapter_range

        series_url = "${{ github.event.inputs.series_url }}"
        start = int("${{ github.event.inputs.start_chapter }}")
        end = int("${{ github.event.inputs.end_chapter }}")

        print(f"Scraping {series_url} chapters {start}-{end}")
        dirs = asyncio.run(scrape_chapter_range(series_url, start, end, "scraped_chapters"))
        print(f"Chapter dirs: {dirs}")

        # Write dirs to file so next step can read them
        with open("chapter_dirs.txt", "w") as f:
            f.write("\n".join(dirs))
        EOF

    - name: Process chapters through pipeline
      env:
        PYTHONPATH: ${{ github.workspace }}
        GROQ_KEY: ${{ secrets.GROQ_KEY }}
        GROQ_KEY_2: ${{ secrets.GROQ_KEY_2 }}
        GROQ_KEY_3: ${{ secrets.GROQ_KEY_3 }}
        GROQ_KEY_4: ${{ secrets.GROQ_KEY_4 }}
      run: |
        # Read chapter dirs
        CHAPTER_DIRS=$(cat chapter_dirs.txt)

        if [ -z "$CHAPTER_DIRS" ]; then
          echo "❌ No chapter dirs found — scraping likely failed"
          exit 1
        fi

        mkdir -p chunk_output

        # Process each chapter directory
        while IFS= read -r CH_DIR; do
          if [ -z "$CH_DIR" ]; then continue; fi

          CH_NAME=$(basename "$CH_DIR")
          echo "Processing: $CH_DIR → $CH_NAME"

          # Find first image to confirm pages exist
          FIRST_IMG=$(find "$CH_DIR" -name "*.jpg" -o -name "*.png" -o -name "*.webp" | sort | head -1)
          if [ -z "$FIRST_IMG" ]; then
            echo "⚠ No images in $CH_DIR, skipping"
            continue
          fi

          IMG_COUNT=$(find "$CH_DIR" -name "*.jpg" -o -name "*.png" -o -name "*.webp" | wc -l)
          echo "  Images: $IMG_COUNT"

          # Run pipeline on the chapter image directory
          python pipeline.py "$CH_DIR" \
            --start-page 1 \
            --voice af_bella \
            --batch-size 4 \
            --format webtoon \
            --dpi 150 \
            --output-dir "chunk_output/$CH_NAME"

          # Delete source images after processing to save space
          rm -rf "$CH_DIR"
          echo "  ✓ $CH_NAME done, source images deleted"

        done < chapter_dirs.txt

    - name: Merge chapter videos into chunk video
      run: |
        find chunk_output -name "*.mp4" | sort > /tmp/mp4_list.txt
        echo "MP4s found:"
        cat /tmp/mp4_list.txt

        python - <<'EOF'
        import subprocess, os

        mp4s = open('/tmp/mp4_list.txt').read().strip().splitlines()
        if not mp4s:
            raise RuntimeError("No MP4s found in chunk_output")

        concat_file = '/tmp/concat.txt'
        with open(concat_file, 'w') as f:
            for p in mp4s:
                f.write(f"file '{os.path.abspath(p)}'\n")

        out = 'chunk_final.mp4'
        subprocess.run([
            'ffmpeg', '-y', '-f', 'concat', '-safe', '0',
            '-i', concat_file, '-c', 'copy', out
        ], check=True)
        size_mb = os.path.getsize(out) / 1024 / 1024
        print(f"✓ chunk_final.mp4 ({size_mb:.1f} MB)")
        EOF

    - name: Upload as GitHub Release asset
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        TAG="chunk-${{ github.event.inputs.job_id }}-ch${{ github.event.inputs.start_chapter }}-${{ github.event.inputs.end_chapter }}"
        FILENAME="chunk_ch${{ github.event.inputs.start_chapter }}_${{ github.event.inputs.end_chapter }}.mp4"
        cp chunk_final.mp4 "$FILENAME"

        gh release create "$TAG" "$FILENAME" \
          --title "$TAG" \
          --notes "Chunk ch${{ github.event.inputs.start_chapter }}-${{ github.event.inputs.end_chapter }}" \
          --prerelease

        ASSET_URL=$(gh release view "$TAG" --json assets --jq '.assets[0].url')
        echo "ASSET_URL=$ASSET_URL" >> $GITHUB_ENV
        echo "✓ Release: $ASSET_URL"

    - name: Report done to orchestrator DB
      if: success()
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      run: |
        python - <<'EOF'
        import os, requests
        from datetime import datetime
        url = os.environ['SUPABASE_URL']
        key = os.environ['SUPABASE_KEY']
        h = {'apikey': key, 'Authorization': f'Bearer {key}', 'Content-Type': 'application/json'}
        r = requests.patch(f"{url}/rest/v1/chunks", headers=h,
            json={
                'status': 'done',
                'release_url': os.environ.get('ASSET_URL', ''),
                'completed_at': datetime.utcnow().isoformat()
            },
            params={'id': f"eq.${{ github.event.inputs.chunk_id }}"})
        print(f"✓ Reported done: {r.status_code}")
        EOF

    - name: Report failed to orchestrator DB
      if: failure()
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      run: |
        python - <<'EOF'
        import os, requests
        url = os.environ['SUPABASE_URL']
        key = os.environ['SUPABASE_KEY']
        h = {'apikey': key, 'Authorization': f'Bearer {key}', 'Content-Type': 'application/json'}
        requests.patch(f"{url}/rest/v1/chunks", headers=h,
            json={'status': 'failed'},
            params={'id': f"eq.${{ github.event.inputs.chunk_id }}"})
        EOF
